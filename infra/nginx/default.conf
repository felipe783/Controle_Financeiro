# Nginx: serve o React compilado e encaminha /api para o backend pela rede interna do Docker.
server_tokens off;

upstream api_backend {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 3m;   # importação CSV (limite da API: 2 MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. Recharts usa estilos inline, por isso style-src permite 'unsafe-inline'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Com HTTPS na frente (proxy/terminação TLS), habilite também:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Atualização manual de cotações pode levar alguns segundos por ativo.
        proxy_read_timeout 180s;
    }

    # Arquivos com hash no nome podem ficar em cache indefinidamente. Usa-se `expires` (e não add_header)
    # porque add_header dentro de um location anularia os cabeçalhos de segurança herdados do server.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Rotas do React (ex.: /investimentos) caem no index.html, que nunca fica em cache.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
